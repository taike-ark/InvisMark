name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装（运行时只依赖 numpy）
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" pillow

      - name: 单元测试（59 个）
        run: python -m unittest discover -s tests -t . -v

      - name: 端到端 demo
        run: python -m invismark demo --out demo

      - name: 鲁棒性矩阵（小图快速版，守住基线）
        run: python scripts/bench_matrix.py --width 800 --height 600 --base 800

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -f deploy/Dockerfile -t invismark:ci .
      - name: 冒烟（启动 + 健康检查）
        run: |
          docker run -d --name invismark-ci -p 8000:8000 invismark:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs invismark-ci
          exit 1
