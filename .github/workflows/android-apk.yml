name: android-apk

# 手动触发：在 GitHub 的机器上构建 Android APK 并挂到 Release。
# 之所以放 CI 里做：某些网络环境下本机访问 uploads.github.com 会被拦，
# 而 runner 到 Release 的上传是通的。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: analyze + test
        working-directory: apps/mobile
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: build release apk
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          gh release upload "$TAG" "$APK#InvisMark-0.1.0-android.apk" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

