name: android-apk

# 手动触发：在 GitHub 的机器上构建 Android APK，替换 Release 资产并重算 SHA256SUMS。
# 之所以放 CI：某些网络环境下本机访问 uploads.github.com 会被拦，
# 而 runner 上传 Release 资产是通的。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: analyze + test
        working-directory: apps/mobile
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: build release apk
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: replace release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" InvisMark-0.1.0-android.apk
          for name in app-release.apk InvisMark-0.1.0-android.apk; do
            gh release delete-asset "$TAG" "$name" --yes || true
          done
          gh release upload "$TAG" InvisMark-0.1.0-android.apk --clobber

      - name: refresh sha256sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          mkdir -p /tmp/assets && cd /tmp/assets
          gh release download "$TAG" -D . --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release delete-asset "$TAG" SHA256SUMS.txt --yes || true
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
